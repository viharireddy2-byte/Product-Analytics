name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n ops/commerce.sh tests/operations_test.sh
      - name: Verify operational failure paths
        run: bash tests/operations_test.sh
